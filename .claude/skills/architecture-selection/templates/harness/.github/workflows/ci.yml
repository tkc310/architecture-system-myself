# 品質ゲートの必須ステージ(references/quality-gates.md)。すべてをブランチ保護の必須チェックに指定する。
# E2E と VRT は実行コストが高いので CI に含めず、手元で pnpm test:e2e を実行する(references/testing-strategy.md)。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 1. フォーマットの確認
        run: pnpm format:check
      - name: 2. lint と依存ルール
        run: |
          pnpm lint
          pnpm lint:deps
      - name: 3. 型チェック
        run: pnpm typecheck
      - name: 4. テストとカバレッジの閾値
        run: pnpm test:coverage
      - name: 5. 生成コードの差分
        run: pnpm generate:check
      - name: 6. ビルド
        run: pnpm build

  audit:
    # 推奨: 依存パッケージの脆弱性検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm audit --prod
