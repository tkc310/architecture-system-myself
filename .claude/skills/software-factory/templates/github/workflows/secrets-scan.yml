# 秘密情報の検出(references/guardrails.md の層 5)。ブランチ保護の必須チェックに指定する。
# 組織のリポジトリでは gitleaks-action のライセンスキー(GITLEAKS_LICENSE)が要る。個人のリポジトリでは要らない。
# 導入時に gitleaks-action の README で、現行の版と設定を確認すること。
name: secrets-scan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
