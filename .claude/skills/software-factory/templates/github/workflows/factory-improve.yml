# 週ごとの改善。直近 1 週間の記録、CI の失敗、レビューの指摘から、規則を強める下書き PR を作る。
# 手順は docs/factory/improve.md。PR のマージは人が行う。
#
# 注意: GITHUB_TOKEN で作った PR では、他のワークフロー(CI)が自動では動かない。
# CI を動かしたい場合は、GitHub App のトークンを github_token に渡すか、人が PR を閉じて開き直す。
name: factory-improve

on:
  schedule:
    - cron: "17 0 * * 1" # 毎週月曜 00:17 UTC(日本時間 9:17)
  workflow_dispatch:

concurrency:
  group: factory-improve
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FACTORY_JOB: improve
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Git の作者を設定
        run: |
          git config user.name "factory-improve[bot]"
          git config user.email "factory-improve@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            docs/factory/improve.md を読み、その手順どおりに週次の改善を行ってください。
            対象期間は、今日から 7 日前までです。
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(gh run list *),Bash(gh run view *),Bash(gh pr list *),Bash(gh pr view *),Bash(gh api *),Bash(gh issue create *),Bash(gh issue list *),Bash(git log *),Bash(git diff *),Bash(git switch *),Bash(git add *),Bash(git commit *),Bash(git push -u origin factory/*),Bash(gh pr create --draft *),Bash(pnpm check),Bash(pnpm lint),Bash(pnpm lint:deps)"
