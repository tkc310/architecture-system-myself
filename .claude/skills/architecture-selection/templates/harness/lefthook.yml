# 手元のコミットを止める。--no-verify で回避できるので、CI の代わりにはならない。
pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,md,css}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint {staged_files}
    deps:
      glob: "src/**/*.{ts,tsx}"
      run: pnpm exec depcruise --config .dependency-cruiser.cjs {staged_files}

pre-push:
  commands:
    check:
      run: make check
