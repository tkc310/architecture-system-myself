# 品質ゲートの必須ステージ(references/quality-gates.md)。すべてをブランチ保護の必須チェックに指定する。
# E2E と VRT は実行コストが高いので CI に含めず、手元で make test-e2e を実行する(references/testing-strategy.md)。
# 手元と同じく、コマンドはすべて Makefile のターゲットで叩く(references/coding-conventions.md)。
name: ci

on:
  pull_request:
    # ready_for_review: 下書きの PR を人が「Ready for review」にしたときにも動かす
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      # make install は、インストールの前に依存の供給網の設定(make check-supply-chain)を確かめる(references/security.md)
      - run: make install

      - name: 1. フォーマットの確認
        run: make format-check
      - name: 2. lint と依存ルール
        run: |
          make lint
          make lint-deps
      - name: 3. 型チェック
        run: make typecheck
      - name: 4. テストとカバレッジの閾値
        run: make test-coverage
      - name: 5. 生成コードの差分
        run: make generate-check
      - name: 6. ビルド
        run: make build

  audit:
    # 推奨: 依存パッケージの脆弱性検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      # Takumi Guard は取得専用のプロキシなので、脆弱性の照会は npm の公式のレジストリに行う(Makefile の audit)
      - run: make audit
