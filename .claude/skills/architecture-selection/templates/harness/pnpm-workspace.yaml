# 依存の供給網の対策(references/security.md の「依存の供給網」)。保護パス。設定を外すときは ADR と承認が要る。
# pnpm 10.21 以上が必要(package.json の packageManager と engines.pnpm で固定する)。
# 単一パッケージのリポジトリでも、pnpm の設定を置くためにこのファイルを置く。モノレポなら packages を足す。

# 前の版より信頼の度合い(trusted publisher、provenance)が下がった版を入れない。
# 公開者のアカウントの乗っ取りで、CI から公開されていた依存が手元から公開されたときに止まる。
trustPolicy: no-downgrade

# 正当な理由で信頼の度合いが下がった版だけを、版まで指定して外す(例: "some-pkg@1.2.3")。
# 足すときは、公開元の告知で理由を確かめ、ADR に書いて承認を得る。名前だけの指定はしない。
trustPolicyExclude: []

# 次の 2 つは pnpm 11 以降の既定値で有効。無効にしない。
# - minimumReleaseAge: 1440(公開から 24 時間たっていない版を入れない)
# - blockExoticSubdeps: true(間接依存が git や tarball の URL から入るのを止める)
